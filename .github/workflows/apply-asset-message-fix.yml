name: Apply asset message fix

on:
  push:
    branches:
      - fix/asset-instruction-messages
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'fix/asset-instruction-messages')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/asset-instruction-messages
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply fix
        run: node scripts/apply-asset-message-fix.mjs
      - name: Format
        run: pnpm exec prettier --write common/assets.ts app/src/lib/generate.ts app/tests/unit/assets.spec.ts app/tests/e2e/assets.spec.ts package.json
      - name: Validate
        run: pnpm run check
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add common/assets.ts app/src/lib/generate.ts app/tests/unit/assets.spec.ts app/tests/e2e/assets.spec.ts package.json
          git commit -m "fix: include asset list in structured inference messages"
          git push origin HEAD:fix/asset-instruction-messages
