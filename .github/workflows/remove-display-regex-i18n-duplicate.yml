name: Remove display regex i18n duplicate

on:
  push:
    branches:
      - feat/display-regex

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/display-regex
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/remove-display-regex-i18n-duplicate.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/lib/i18n.svelte.ts
          git commit -m "fix: reuse existing enabled translation"
          git push
