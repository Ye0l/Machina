name: Apply PWA horizontal safe area fix

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/apply-pwa-horizontal-safe-area.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply horizontal safe-area padding
        run: |
          python - <<'PY'
          from pathlib import Path

          chat = Path('app/src/routes/Chat.svelte')
          text = chat.read_text()
          old = 'class="shrink-0 border-t border-neutral-800/80 bg-[#0d1118] px-3 pb-[max(0.375rem,calc(env(safe-area-inset-bottom)-1rem))] pt-3 sm:px-5 sm:pb-3"'
          new = 'class="chat-composer-shell shrink-0 border-t border-neutral-800/80 bg-[#0d1118] pb-[max(0.375rem,calc(env(safe-area-inset-bottom)-1rem))] pt-3 sm:pb-3"'
          if old not in text:
              raise SystemExit('chat composer class marker not found')
          chat.write_text(text.replace(old, new, 1))

          css = Path('app/src/app.css')
          text = css.read_text()
          marker = '/* Machina semantic overrides for the few legacy arbitrary-color utilities. */'
          block = '''/* Keep the edge-to-edge PWA shell while protecting controls from rounded corners and landscape notches. */
          .chat-composer-shell {
            padding-left: max(0.75rem, env(safe-area-inset-left));
            padding-right: max(0.75rem, env(safe-area-inset-right));
          }

          @media (min-width: 640px) {
            .chat-composer-shell {
              padding-left: max(1.25rem, env(safe-area-inset-left));
              padding-right: max(1.25rem, env(safe-area-inset-right));
            }
          }

          '''
          if marker not in text:
              raise SystemExit('app css marker not found')
          css.write_text(text.replace(marker, block + marker, 1))

          test = Path('app/tests/e2e/mobile.spec.ts')
          text = test.read_text()
          old = "for (const path of ['/', '/settings/display', '/memory', '/character/new'])"
          new = "for (const path of ['/', '/chat/chat-1', '/settings/display', '/memory', '/character/new'])"
          if old not in text:
              raise SystemExit('mobile overflow path marker not found')
          test.write_text(text.replace(old, new, 1))
          PY

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write app/src/routes/Chat.svelte app/src/app.css app/tests/e2e/mobile.spec.ts
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test app/tests/e2e/mobile.spec.ts --config app/playwright.config.ts

      - name: Commit validated fix and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-pwa-horizontal-safe-area.yml
          git add app/src/routes/Chat.svelte app/src/app.css app/tests/e2e/mobile.spec.ts
          git commit -m "fix: respect horizontal safe areas in PWA chat composer"
          git push origin HEAD:dev
