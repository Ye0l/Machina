name: Format Machina Svelte files

on:
  push:
    branches:
      - feat/machina-themes-scroll-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/machina-themes-scroll-v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format once
        run: pnpm exec prettier --write app/src/routes/Chat.svelte app/src/routes/Settings.svelte
      - name: Verify formatter result
        run: pnpm exec prettier --check app/src/routes/Chat.svelte app/src/routes/Settings.svelte
      - name: Commit formatter output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/routes/Chat.svelte app/src/routes/Settings.svelte
          git commit -m "style: format Machina chat and settings views"
          git push origin HEAD:feat/machina-themes-scroll-v2
