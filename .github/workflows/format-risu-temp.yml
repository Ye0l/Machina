name: Apply Machina fixes

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chore/readme-risu-ui-remove-legacy' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/readme-risu-ui-remove-legacy
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply fixes
        run: |
          python .github/scripts/fix-collapsed-sidebar-duplicates.py
          rm .github/scripts/fix-collapsed-sidebar-duplicates.py
          rm -f .github/fix-trigger
      - name: Install and format
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write app/src/shared/AppShell.svelte app/src/lib/settings.svelte.ts app/src/lib/books.svelte.ts srv/api/user/presets.ts srv/api/user/index.ts
      - name: Verify
        run: |
          pnpm run check
          pnpm run build
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: keep collapsed navigation and clone presets reliably"
          git push origin HEAD:chore/readme-risu-ui-remove-legacy
