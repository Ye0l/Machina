name: Format Risu toggle files

on:
  push:
    branches:
      - feat/risu-prompt-toggles
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/risu-prompt-toggles
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write common/risu-toggles.ts app/src/shared/RisuTogglePanel.svelte
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add common/risu-toggles.ts app/src/shared/RisuTogglePanel.svelte
          git commit -m "style: format Risu toggle files"
          git push origin HEAD:feat/risu-prompt-toggles
