name: Apply Machina cleanup

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chore/readme-risu-ui-remove-legacy' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/readme-risu-ui-remove-legacy
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply source changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('tsconfig.json')
          path.write_text(re.sub(r'/\*.*?\*/', '', path.read_text(), flags=re.S), encoding='utf-8')
          PY
          python .github/scripts/apply-readme-risu-legacy-cleanup.py
          git rm -r web
          rm -f .github/scripts/apply-readme-risu-legacy-cleanup.py
          rm -f .github/workflows/apply-readme-risu-legacy-cleanup.yml
          rm -f .github/cleanup-trigger .github/cleanup-trigger-2
      - name: Refresh lockfile and format
        run: |
          pnpm install --lockfile-only
          pnpm exec prettier --write README.md package.json tsconfig.json app/src/shared/AppShell.svelte app/src/shared/RisuImportButton.svelte app/src/routes/Settings.svelte
      - name: Install and verify
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: describe Machina and remove legacy frontend"
          git push origin HEAD:chore/readme-risu-ui-remove-legacy
