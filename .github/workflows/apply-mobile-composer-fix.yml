name: Apply mobile composer fix

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/apply-mobile-composer-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply composer behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          chat = Path('app/src/routes/Chat.svelte')
          text = chat.read_text()

          original_shell = 'class="shrink-0 border-t border-neutral-800/80 bg-[#0d1118] px-3 pb-[max(0.375rem,calc(env(safe-area-inset-bottom)-1rem))] pt-3 sm:px-5 sm:pb-3"'
          horizontal_shell = 'class="chat-composer-shell shrink-0 border-t border-neutral-800/80 bg-[#0d1118] pb-[max(0.375rem,calc(env(safe-area-inset-bottom)-1rem))] pt-3 sm:pb-3"'
          desired_shell = 'class="chat-composer-shell shrink-0 border-t border-neutral-800/80 bg-[#0d1118] px-3 pb-[max(0.375rem,calc(env(safe-area-inset-bottom)-1rem))] pt-3 sm:px-5 sm:pb-3"'

          if horizontal_shell in text:
              text = text.replace(horizontal_shell, desired_shell, 1)
          elif original_shell in text:
              text = text.replace(original_shell, desired_shell, 1)
          elif desired_shell not in text:
              raise SystemExit('chat composer shell marker not found')

          old_handler = '''  const handleComposerKeydown = (event: KeyboardEvent) => {
            if (event.key !== 'Enter' || event.shiftKey || event.isComposing) return
            event.preventDefault()
            event.currentTarget instanceof HTMLTextAreaElement && event.currentTarget.form?.requestSubmit()
          }
          '''
          new_handler = '''  const handleComposerKeydown = (event: KeyboardEvent) => {
            if (event.key !== 'Enter' || event.isComposing) return

            const textarea = event.currentTarget
            if (!(textarea instanceof HTMLTextAreaElement)) return

            if (event.ctrlKey || event.metaKey) {
              event.preventDefault()
              textarea.form?.requestSubmit()
              return
            }

            // Touch-oriented devices use Enter for a normal newline. Desktop keeps the
            // existing Enter-to-send behavior, with Shift+Enter available for a newline.
            if (event.shiftKey || window.matchMedia('(pointer: coarse)').matches) return

            event.preventDefault()
            textarea.form?.requestSubmit()
          }
          '''
          if old_handler not in text:
              raise SystemExit('composer key handler marker not found')
          chat.write_text(text.replace(old_handler, new_handler, 1))

          css = Path('app/src/app.css')
          text = css.read_text()
          horizontal_block = '''/* Keep the edge-to-edge PWA shell while protecting controls from rounded corners and landscape notches. */
          .chat-composer-shell {
            padding-left: max(0.75rem, env(safe-area-inset-left));
            padding-right: max(0.75rem, env(safe-area-inset-right));
          }

          @media (min-width: 640px) {
            .chat-composer-shell {
              padding-left: max(1.25rem, env(safe-area-inset-left));
              padding-right: max(1.25rem, env(safe-area-inset-right));
            }
          }

          '''
          text = text.replace(horizontal_block, '')

          marker = '/* Machina semantic overrides for the few legacy arbitrary-color utilities. */'
          bottom_block = '''/* Lift the mobile PWA composer by roughly half an input height without narrowing it. */
          @media (display-mode: standalone) and (max-width: 639px) {
            .chat-composer-shell {
              padding-bottom: calc(
                max(0.375rem, calc(env(safe-area-inset-bottom) - 1rem)) + 1.375rem
              );
            }
          }

          '''
          if bottom_block not in text:
              if marker not in text:
                  raise SystemExit('app css marker not found')
              text = text.replace(marker, bottom_block + marker, 1)
          css.write_text(text)

          test = Path('app/tests/e2e/mobile.spec.ts')
          text = test.read_text()
          # Undo the abandoned horizontal-overflow-only change if it landed first.
          text = text.replace(
              "for (const path of ['/', '/chat/chat-1', '/settings/display', '/memory', '/character/new'])",
              "for (const path of ['/', '/settings/display', '/memory', '/character/new'])",
          )

          anchor = "  test('blocks global zoom and does not add bottom safe-area padding to chat', async ({ app }) => {"
          newline_test = '''  test('Enter inserts a newline in the mobile composer', async ({ app, stub }) => {
            await app.goto('/chat/chat-1')
            await expect(app.getByText('Greetings from Aria.')).toBeVisible()

            const composer = app.getByPlaceholder('Send a message')
            await composer.fill('first line')
            await composer.press('Enter')

            await expect(composer).toHaveValue('first line\\n')
            expect(stub.state.sends).toHaveLength(0)

            await app.getByRole('button', { name: 'Send message' }).click()
            await expect.poll(() => stub.state.sends.length).toBe(1)
          })

          '''
          if newline_test not in text:
              if anchor not in text:
                  raise SystemExit('mobile test anchor not found')
              text = text.replace(anchor, newline_test + anchor, 1)
          test.write_text(text)
          PY

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write app/src/routes/Chat.svelte app/src/app.css app/tests/e2e/mobile.spec.ts
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test app/tests/e2e/mobile.spec.ts --config app/playwright.config.ts

      - name: Commit validated fix and remove temporary workflows
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/apply-mobile-composer-fix.yml
          git rm -f .github/workflows/apply-pwa-horizontal-safe-area.yml || true
          git add app/src/routes/Chat.svelte app/src/app.css app/tests/e2e/mobile.spec.ts
          git commit -m "fix: lift mobile PWA composer and keep Enter as newline"
          git pull --rebase origin dev
          git push origin HEAD:dev
