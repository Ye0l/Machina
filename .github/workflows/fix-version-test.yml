name: Update build version test

on:
  push:
    branches: [fix/ios-character-import]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-character-import
          fetch-depth: 0

      - name: Make version assertion release-independent
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/tests/e2e/routing.spec.ts')
          text = path.read_text()
          old = r"await expect(version).toContainText(/v1\.0\.27/)"
          new = r"await expect(version).toContainText(/v\d+\.\d+\.\d+/)"
          assert old in text, 'hard-coded version assertion changed'
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/fix-version-test.yml').unlink()
          PY

      - name: Commit test fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/tests/e2e/routing.spec.ts .github/workflows/fix-version-test.yml
          git commit -m "test: accept future build versions"
          git push origin HEAD:fix/ios-character-import
