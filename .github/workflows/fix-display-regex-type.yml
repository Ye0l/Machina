name: Fix display regex type

on:
  push:
    branches:
      - feat/display-regex

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/display-regex
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-display-regex-type.mjs
      - run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write app/src/lib/settings.svelte.ts
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/lib/settings.svelte.ts
          git commit -m "fix: preserve temporary preset metadata with typed input"
          git push
