name: Fix reroll debug CI

on:
  push:
    branches:
      - fix/reroll-current-settings

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reroll-current-settings
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/fix-reroll-debug-ci.mjs
      - run: pnpm exec prettier --write app/src/lib/generate.ts app/src/lib/generation-debug.ts app/tests/e2e/mobile.spec.ts
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/lib/generate.ts app/src/lib/generation-debug.ts app/tests/e2e/mobile.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: complete reroll debug serialization"
          git push
