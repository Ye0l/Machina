name: Implement Machina duplicate controls and advanced presets

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'feat/machina-duplicate-controls-advanced-presets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply feature patches
        run: |
          python .github/scripts/fix-header-patch-marker.py
          python .github/scripts/patch-header-controls-v2.py
          python .github/scripts/patch-duplicate-entities-v2.py
          python .github/scripts/patch-preset-settings-v2.py
          python .github/scripts/patch-provider-payloads-i18n-v2.py
          rm -f .github/scripts/fix-header-patch-marker.py
          rm -f .github/scripts/patch-header-controls-v2.py
          rm -f .github/scripts/patch-duplicate-entities-v2.py
          rm -f .github/scripts/patch-preset-settings-v2.py
          rm -f .github/scripts/patch-provider-payloads-i18n-v2.py
          rm -f .github/workflows/implement-machina-duplicate-controls.yml
          rm -f .github/workflows/run-duplicate-header-controls.yml

      - run: pnpm install --frozen-lockfile

      - name: Format changed sources
        run: >-
          pnpm exec prettier --write
          app/src/lib/chat-controls.svelte.ts
          app/src/lib/settings.svelte.ts
          app/src/lib/chats.svelte.ts
          app/src/lib/personas.svelte.ts
          app/src/lib/books.svelte.ts
          app/src/routes/Settings.svelte
          app/src/routes/Characters.svelte
          app/src/routes/Personas.svelte
          app/src/routes/Books.svelte
          app/src/routes/Chat.svelte
          app/src/shared/AppShell.svelte
          app/src/shared/Sidebar.svelte
          app/src/shared/RisuTogglePanel.svelte
          app/src/lib/i18n.svelte.ts
          app/tests/unit/provider-settings.spec.ts
          common/provider-settings.ts
          common/presets.ts
          srv/api/character.ts
          srv/adapter/openai.ts
          srv/adapter/claude.ts
          package.json

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: duplicate entities, header controls, and advanced preset parameters"
          git push origin HEAD:${{ github.head_ref }}
