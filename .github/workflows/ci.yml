name: CI

on:
  push:
    branches: [dev]
  pull_request:

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format-risu:
    if: github.event_name == 'push'
    name: Format Risu integration
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/risu-prompt-toggles
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write app/src/shared/AppShell.svelte app/src/shared/RisuImportButton.svelte app/tests/unit/risu-import.spec.ts common/risu-import.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/shared/AppShell.svelte app/src/shared/RisuImportButton.svelte app/tests/unit/risu-import.spec.ts common/risu-import.ts
          git commit -m "style: format Risu integration files"
          git push origin HEAD:feat/risu-prompt-toggles

  check:
    name: Format, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the `engines.node` range in package.json.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prettier, tsc (client/server/tests), svelte-check, the mocha suite for common/ and
      # srv/, and the Vitest suite for the client's pure logic.
      - run: pnpm run check

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only Chromium is configured in playwright.config.ts.
      - run: pnpm exec playwright install --with-deps chromium

      # Builds dist/ first; the stub server in tests/e2e serves it.
      - run: pnpm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: .playwright/
          retention-days: 7
