name: CI

on:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-risu-output:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/risu-asset-tags' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/risu-asset-tags
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch generation and toggle placement
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('app/src/lib/generate.ts')
          text = path.read_text()
          old = """  const reply = await stream(\n    control.requestId,\n    // Appended after assembly rather than through a placeholder: an asset the model was never\n    // told about can never be shown, so this must not depend on the user editing a template.\n    withAssetInstruction(prompt.template.parsed, char.assets),\n    settings,\n    user,\n    chat._id,\n    handlers\n  )"""
          new = """  const request = inferencePrompt(prompt, messages)\n  const reply = await stream(\n    control.requestId,\n    // Appended after assembly rather than through a placeholder: an asset the model was never\n    // told about can never be shown, so this must not depend on the user editing a template.\n    withAssetInstruction(request.prompt, char.assets),\n    request.messages,\n    settings,\n    user,\n    chat._id,\n    handlers\n  )"""
          if text.count(old) != 2:
              raise SystemExit(f'expected two stream call sites, found {text.count(old)}')
          text = text.replace(old, new)

          marker = """/**\n * `POST /chat/inference-stream` answers over the WebSocket as well as SSE"""
          helper = """/**\n * Prefer the structured role blocks produced by the template parser. Gemini rejects a request\n * that contains only a system instruction, so imported Risu templates that placed chat history\n * inside system blocks get the latest user turn appended as a real user message. The flat prompt\n * remains available for completion-style adapters.\n */\nfunction inferencePrompt(\n  assembled: Awaited<ReturnType<typeof createPromptParts>>,\n  history: AppSchema.ChatMessage[]\n) {\n  const prompt = (assembled.template.parsed || assembled.template.blockPrompt || '').trim()\n  const messages = assembled.template.blocks\n    .filter((block) => block.content.trim())\n    .map((block) => ({ role: block.role, content: block.content.trim() }))\n\n  if (!messages.some((block) => block.role === 'user')) {\n    const latest = [...history].reverse().find((message) => !!message.userId && message.msg.trim())\n    if (latest) messages.push({ role: 'user', content: latest.msg.trim() })\n  }\n\n  if (!prompt && !messages.length) {\n    throw new Error('The imported preset produced an empty inference request')\n  }\n\n  return { prompt, messages }\n}\n\n"""
          if marker not in text:
              raise SystemExit('generate helper marker not found')
          text = text.replace(marker, helper + marker, 1)

          old_sig = """async function stream(\n  requestId: string,\n  prompt: string,\n  settings:"""
          new_sig = """async function stream(\n  requestId: string,\n  prompt: string,\n  messages: Array<{ role: string; content: string }>,\n  settings:"""
          if old_sig not in text:
              raise SystemExit('stream signature marker not found')
          text = text.replace(old_sig, new_sig, 1)

          old_body = """      .post('/chat/inference-stream', { requestId, prompt, settings, user, chatId })"""
          new_body = """      .post('/chat/inference-stream', { requestId, prompt, messages, settings, user, chatId })"""
          if old_body not in text:
              raise SystemExit('stream request marker not found')
          text = text.replace(old_body, new_body, 1)
          path.write_text(text)

          path = Path('app/src/shared/RisuTogglePanel.svelte')
          text = path.read_text()
          old_button = 'class="fixed bottom-5 right-5 z-30 flex items-center gap-2 rounded-full'
          new_button = 'class="fixed right-4 z-30 flex items-center gap-2 rounded-full sm:right-5 {settingsMode ? \'bottom-5\' : \'bottom-[calc(5.75rem+env(safe-area-inset-bottom))]\'}'
          if old_button not in text:
              raise SystemExit('toggle button marker not found')
          text = text.replace(old_button, new_button, 1)
          old_panel = 'class="fixed bottom-20 right-5 z-40 max-h-[72vh]'
          new_panel = 'class="fixed bottom-[calc(9.5rem+env(safe-area-inset-bottom))] right-4 z-40 max-h-[calc(100vh-11rem)] sm:right-5'
          if old_panel not in text:
              raise SystemExit('chat panel marker not found')
          text = text.replace(old_panel, new_panel, 1)
          path.write_text(text)
          PY
          pnpm exec prettier --write app/src/lib/generate.ts app/src/shared/RisuTogglePanel.svelte
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/lib/generate.ts app/src/shared/RisuTogglePanel.svelte
          git commit -m "fix: preserve Risu roles and clear composer controls"
          git push origin HEAD:fix/risu-asset-tags

  check:
    name: Format, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: .playwright/
          retention-days: 7
