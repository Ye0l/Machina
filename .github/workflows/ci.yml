name: CI

on:
  push:
    branches: [dev]
  pull_request:

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    name: Format, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/machina-themes-scroll-v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the `engines.node` range in package.json.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Persist formatter output
        run: |
          pnpm exec prettier --write app/src/routes/Chat.svelte app/src/routes/Settings.svelte
          if ! git diff --quiet -- app/src/routes/Chat.svelte app/src/routes/Settings.svelte; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add app/src/routes/Chat.svelte app/src/routes/Settings.svelte
            git commit -m "style: format Machina chat and settings views"
            git push origin HEAD:feat/machina-themes-scroll-v2
          fi

      # Prettier, tsc (client/server/tests), svelte-check, the mocha suite for common/ and
      # srv/, and the Vitest suite for the client's pure logic.
      - run: pnpm run check

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only Chromium is configured in playwright.config.ts.
      - run: pnpm exec playwright install --with-deps chromium

      # Builds dist/ first; the stub server in tests/e2e serves it.
      - run: pnpm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: .playwright/
          retention-days: 7
