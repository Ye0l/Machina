name: Apply mobile chat header patch

on:
  push:
    branches:
      - fix/mobile-chat-header
    paths:
      - .github/workflows/apply-mobile-chat-header.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python .github/scripts/fix_mobile_chat_header.py
      - run: pnpm exec prettier --write app/src/shared/AppShell.svelte app/src/routes/Chat.svelte app/tests/e2e/mobile.spec.ts package.json
      - name: Commit patched sources
        run: |
          rm .github/workflows/apply-mobile-chat-header.yml
          rm .github/scripts/fix_mobile_chat_header.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/shared/AppShell.svelte app/src/routes/Chat.svelte app/tests/e2e/mobile.spec.ts package.json .github
          git commit -m "fix: compact mobile chat header"
          git push
