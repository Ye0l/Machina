name: Apply message branching and theme audit

on:
  push:
    branches:
      - feat/message-branches-dynamic-history-theme-audit
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'feat/message-branches-dynamic-history-theme-audit')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/message-branches-dynamic-history-theme-audit
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply implementation
        run: node scripts/apply-message-branching.mjs
      - name: Format
        run: >-
          pnpm exec prettier --write
          common/message-window.ts
          app/tests/unit/message-window.spec.ts
          app/tests/e2e/message-branches.spec.ts
          app/tests/e2e/theme-contrast.spec.ts
          srv/db/messages.ts
          srv/api/chat/create.ts
          srv/api/chat/index.ts
          app/src/lib/contracts.ts
          app/src/lib/chats.svelte.ts
          app/src/routes/Chat.svelte
          app/src/lib/i18n.svelte.ts
          app/src/app.css
          app/src/themes.css
          app/tests/e2e/stub-server.ts
          package.json
      - name: Validate
        run: pnpm run check
      - name: Browser tests
        run: pnpm exec playwright install --with-deps chromium && pnpm run test:e2e
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add chat branches, safe deletion, dynamic history, and theme audit"
          git push origin HEAD:feat/message-branches-dynamic-history-theme-audit
