name: Patch display regex

on:
  push:
    branches:
      - feat/display-regex

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/display-regex
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/patch-display-regex.mjs
      - name: Format changed files
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            common/display-regex.ts \
            app/src/routes/Chat.svelte \
            app/src/routes/Settings.svelte \
            app/src/lib/settings.svelte.ts \
            app/src/lib/i18n.svelte.ts \
            app/tests/unit/display-regex.spec.ts \
            package.json
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add common/display-regex.ts app/src/routes/Chat.svelte app/src/routes/Settings.svelte app/src/lib/settings.svelte.ts app/src/lib/i18n.svelte.ts app/tests/unit/display-regex.spec.ts package.json
          git commit -m "feat: add display-only regex rules"
          git push
