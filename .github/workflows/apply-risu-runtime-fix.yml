name: Apply Risu runtime rendering fix

on:
  push:
    branches:
      - fix/risu-runtime-rendering
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'fix/risu-runtime-rendering')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/risu-runtime-rendering
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply fix
        run: |
          node scripts/apply-risu-runtime-fix.mjs
          node scripts/fix-risu-preview-test.mjs
      - name: Format
        run: pnpm exec prettier --write common/risu-toggles.ts app/src/lib/prompt-preview.ts app/src/lib/generate.ts app/src/routes/Settings.svelte app/tests/unit/prompt-preview.spec.ts app/tests/unit/risu-toggles.spec.ts app/tests/e2e/risu-runtime.spec.ts package.json
      - name: Validate
        run: pnpm run check
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add common/risu-toggles.ts app/src/lib/prompt-preview.ts app/src/lib/generate.ts app/src/routes/Settings.svelte app/tests/unit/prompt-preview.spec.ts app/tests/unit/risu-toggles.spec.ts app/tests/e2e/risu-runtime.spec.ts package.json
          git commit -m "fix: resolve Risu macros in preview and inference"
          git push origin HEAD:fix/risu-runtime-rendering
      - name: Browser tests
        run: pnpm run test:e2e
