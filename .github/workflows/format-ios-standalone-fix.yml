name: Format iOS standalone fix

on:
  push:
    branches: [fix/ios-standalone-viewport-gap]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-standalone-viewport-gap
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write app/index.html app/tests/e2e/mobile.spec.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/index.html app/tests/e2e/mobile.spec.ts
          git commit -m "style: format iOS standalone fix"
          git push
