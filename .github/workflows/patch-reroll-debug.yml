name: Patch reroll debug

on:
  push:
    branches:
      - fix/reroll-current-settings
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'push' || github.head_ref == 'fix/reroll-current-settings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reroll-current-settings
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply patch
        id: apply
        continue-on-error: true
        run: node scripts/patch-reroll-debug.mjs 2>&1 | tee .patch-reroll-error.log
      - name: Commit patch error
        if: steps.apply.outcome == 'failure'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .patch-reroll-error.log
          git commit -m "chore: record reroll patch error"
          git push origin HEAD:fix/reroll-current-settings
      - name: Format
        if: steps.apply.outcome == 'success'
        run: pnpm exec prettier --write app/src/lib/generate.ts app/src/lib/contracts.ts app/src/lib/chats.svelte.ts app/src/routes/Chat.svelte app/src/lib/i18n.svelte.ts app/tests/e2e/stub-server.ts app/tests/e2e/reroll-debug.spec.ts srv/api/chat/edit.ts package.json
      - name: Commit patch
        if: steps.apply.outcome == 'success'
        run: |
          rm -f .patch-reroll-error.log
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/lib/generate.ts app/src/lib/contracts.ts app/src/lib/chats.svelte.ts app/src/routes/Chat.svelte app/src/lib/i18n.svelte.ts app/tests/e2e/stub-server.ts app/tests/e2e/reroll-debug.spec.ts srv/api/chat/edit.ts package.json
          git commit -m "feat: improve reroll and expose generation debug info"
          git push origin HEAD:fix/reroll-current-settings
