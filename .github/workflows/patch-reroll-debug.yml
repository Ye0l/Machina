name: Patch reroll debug

on:
  push:
    branches:
      - fix/reroll-current-settings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reroll-current-settings
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/patch-reroll-debug.mjs
      - name: Format
        run: corepack enable && pnpm exec prettier --write app/src/lib/generate.ts app/src/lib/contracts.ts app/src/lib/chats.svelte.ts app/src/routes/Chat.svelte app/src/lib/i18n.svelte.ts app/tests/e2e/stub-server.ts app/tests/e2e/reroll-debug.spec.ts srv/api/chat/edit.ts package.json
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/lib/generate.ts app/src/lib/contracts.ts app/src/lib/chats.svelte.ts app/src/routes/Chat.svelte app/src/lib/i18n.svelte.ts app/tests/e2e/stub-server.ts app/tests/e2e/reroll-debug.spec.ts srv/api/chat/edit.ts package.json
          git commit -m "feat: improve reroll and expose generation debug info"
          git push
