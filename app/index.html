<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#10151d" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Machina" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/machina-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/machina-icon.svg" />
    <style>
      html,
      body {
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: pan-x pan-y;
        -webkit-text-size-adjust: 100%;
      }

      @media (max-width: 767px) {
        input,
        select,
        textarea {
          font-size: 16px !important;
        }
      }

      @media (max-width: 639px) {
        [data-testid='chat-view'] > .shrink-0.border-t {
          padding-bottom: 0 !important;
        }

        section[aria-label='Prompt toggles'],
        section[aria-label='프롬프트 토글'] {
          max-height: calc(100dvh - 4rem - env(safe-area-inset-top)) !important;
        }
      }
    </style>
    <title>Machina</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
